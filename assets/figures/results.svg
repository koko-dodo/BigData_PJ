<text x="40" y="410" font-size="14" fill="#475569">V2 flags 77.52% fewer points than V1. This is not a false-positive reduction metric.</text>
<text x="40" y="435" font-size="14" fill="#475569">Source: course experiment report; counts were not recomputed in this cleanup.</text>
